services:
  - type: web
    name: sentinel-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: APP_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: sentinel-api-v6od.onrender.com,127.0.0.1,localhost
      - key: FRONTEND_URL
        value: https://sentinel-web-78kj.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: sentinel

  - type: web
    name: sentinel-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: API_SERVER_URL
        value: https://sentinel-api-v6od.onrender.com
